name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Show toolchain
        run: moon version --all

      - name: Check all stable backends
        run: moon check --target all --deny-warn --warn-list +73

      - name: Test all stable backends
        run: moon test --target all --deny-warn

      - name: Smoke test native CLI
        run: |
          moon run cmd/main -- version
          moon run cmd/main -- validate examples/sample.sarif
          moon run cmd/main -- summary examples/sample.sarif --pretty
          moon run cmd/main -- filter examples/sample.sarif --level warning --output "$RUNNER_TEMP/filtered.sarif"
          moon run cmd/main -- merge examples/sample.sarif examples/sample.sarif --output "$RUNNER_TEMP/merged.sarif"
          moon run cmd/main -- deduplicate "$RUNNER_TEMP/merged.sarif" --output "$RUNNER_TEMP/unique.sarif"
          moon run cmd/main -- baseline "$RUNNER_TEMP/unique.sarif" examples/sample.sarif

      - name: Verify formatting
        run: |
          moon fmt
          git diff --exit-code

      - name: Verify generated interfaces
        run: |
          moon info
          test -s pkg.generated.mbti
          test -s cmd/main/pkg.generated.mbti
