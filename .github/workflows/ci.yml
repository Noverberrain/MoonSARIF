name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install MoonBit
        env:
          MOONBIT_INSTALL_VERSION: 0.10.4+2cc641edf
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Show toolchain
        run: moon version --all

      - name: Resolve MoonBit dependencies
        run: moon update

      - name: Check all stable backends
        run: moon check --target all --deny-warn --warn-list +73

      - name: Test all stable backends
        run: moon test --target all --deny-warn

      - name: Smoke test native CLI
        run: |
          moon run cmd/main -- version
          moon run cmd/main -- validate examples/sample.sarif
          moon run cmd/main -- github-check examples/sample.sarif
          moon run cmd/main -- summary examples/sample.sarif --pretty
          moon run cmd/main -- filter examples/sample.sarif --level warning --output "$RUNNER_TEMP/filtered.sarif"
          moon run cmd/main -- merge examples/sample.sarif examples/sample.sarif --output "$RUNNER_TEMP/merged.sarif"
          moon run cmd/main -- deduplicate "$RUNNER_TEMP/merged.sarif" --output "$RUNNER_TEMP/unique.sarif"
          moon run cmd/main -- baseline "$RUNNER_TEMP/unique.sarif" examples/sample.sarif --fail-on-new
          moon run cmd/main -- report examples/sample.sarif --format markdown --output "$RUNNER_TEMP/report.md"
          moon run cmd/main -- report examples/sample.sarif --format html --output "$RUNNER_TEMP/report.html"

      - name: Run CLI regression tests
        run: |
          bash tests/cli_smoke.sh
          bash tests/fixture_regression.sh
          bash tests/cli_edge_cases.sh

      - name: Run small performance benchmark
        run: python3 tools/benchmark.py --results 1000

      - name: Verify formatting
        run: |
          moon fmt
          git diff --exit-code

      - name: Verify generated interfaces
        run: |
          moon info
          test -s pkg.generated.mbti
          test -s cmd/main/pkg.generated.mbti
